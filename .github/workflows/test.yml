name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  # PR 分支同组抢占取消旧 run；push(main) 按 run_id 独立分组，避免被默认 queue: single 覆盖
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full:
    name: full
    runs-on: windows-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 判定变更范围（纯文档快速路径 / 兜底全量）
        id: changes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $docsOnly = 'false'
          $reason = '非 PR 事件，兜底全量'

          if ('${{ github.event_name }}' -eq 'pull_request') {
            try {
              $files = @(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
              if ($LASTEXITCODE -ne 0 -or $files.Count -eq 0) {
                $reason = "PR 文件列表获取失败或为空（exit=$LASTEXITCODE, count=$($files.Count)），兜底全量"
              } else {
                # 严格文档白名单（Fail-Closed）：
                # 排除 docs/agents/art-pipeline.md（tests/native/blender_cli_test.lua 会读取其小节标题）
                $allDocs = $true
                foreach ($f in $files) {
                  $isRootDoc = $f -match '^(README|AGENTS|GLOSSARY|CODING_STANDARDS)\.md$'
                  $isDocsMd = ($f -match '^docs/.*\.md$') -and ($f -ne 'docs/agents/art-pipeline.md')
                  if (-not ($isRootDoc -or $isDocsMd)) {
                    $allDocs = $false
                    $reason = "命中非纯文档白名单文件: $f"
                    break
                  }
                }
                if ($allDocs) {
                  $docsOnly = 'true'
                  $reason = "全部 $($files.Count) 个变更文件均命中纯文档白名单，走 guards 快速路径"
                }
              }
            } catch {
              $reason = "变更检测异常（$($_.Exception.Message)），兜底全量"
            }
          }

          Write-Host "docs_only=$docsOnly ($reason)"
          "docs_only=$docsOnly" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 安装预构建 Lua 5.4.6 / LuaRocks 3.12.2 / Busted 2.3.0-1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "ci-toolchain-lua5.4.6-busted2.3.0-1-win-x64.zip"
          $expected = "B936BF844DC22B14CA9FFF38AFF32B72D1D41D703612EDA50629E88C38E53103"
          $dest = Join-Path $env:RUNNER_TEMP "ci-toolchain"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          gh release download ci-toolchain-v1 --repo "${{ github.repository }}" --pattern $archive --dir $env:RUNNER_TEMP --clobber
          if ($LASTEXITCODE -ne 0) { throw "下载预构建工具链失败（exit=$LASTEXITCODE）" }
          $zipPath = Join-Path $env:RUNNER_TEMP $archive
          $actual = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actual -ne $expected) { throw "$archive SHA-256 不匹配: $actual != $expected" }
          Expand-Archive -Path $zipPath -DestinationPath $dest -Force
          Remove-Item $zipPath -Force
          "$(Join-Path $dest 'bin')" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "LUA_PATH=$dest\share\lua\5.4\?.lua;$dest\share\lua\5.4\?\init.lua;.\?.lua;.\?\init.lua" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LUA_CPATH=$dest\lib\lua\5.4\?.dll;.\?.dll" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 计算并行度（2× 核数，下限 4、上限 8）
        id: jobs
        run: |
          # 宿主规格与实测（public 标准 runner：EPYC 7763，2 核 / 4 逻辑核 / 16 GB）：
          # full 串行 24.0 秒；--jobs 2 15.8 秒、4 13.2 秒、8 12.3 秒。
          # 分片墙钟由最慢那片决定，片数多于核数时收益来自把尾巴切碎；上限对齐 tools/test.lua 的 MAX_JOBS。
          $cpu = [int]$env:NUMBER_OF_PROCESSORS
          if ($cpu -lt 1) { $cpu = 2 }
          $jobs = [Math]::Min([Math]::Max($cpu * 2, 4), 8)
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List
          Write-Host "NUMBER_OF_PROCESSORS=$cpu → --jobs $jobs"
          "jobs=$jobs" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 运行 guards 测试车道（纯文档快速路径）
        if: steps.changes.outputs.docs_only == 'true'
        run: lua tools/cli.lua test guards --jobs ${{ steps.jobs.outputs.jobs }}

      - name: 运行 full 测试车道
        if: steps.changes.outputs.docs_only != 'true'
        run: lua tools/cli.lua test full --jobs ${{ steps.jobs.outputs.jobs }}

      - name: 缓存 emmylua_check 0.25.1
        id: cache-emmylua
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: .emmylua
          key: ${{ runner.os }}-emmylua-0.25.1-577982E6-v1

      - name: 安装 emmylua_check 0.25.1
        if: steps.changes.outputs.docs_only != 'true' && steps.cache-emmylua.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path .emmylua | Out-Null
          Invoke-WebRequest -Uri "https://github.com/EmmyLuaLs/emmylua-analyzer-rust/releases/download/0.25.1/emmylua_check-win32-x64.zip" -OutFile ".emmylua/emmylua_check.zip"
          $actual = (Get-FileHash ".emmylua/emmylua_check.zip" -Algorithm SHA256).Hash.ToUpperInvariant()
          $expected = "577982E68D925972D8AE35F54B5F384AD77A84A2E31E340BD663D1EFD2EF5983"
          if ($actual -ne $expected) { throw "emmylua_check.zip SHA-256 不匹配: $actual != $expected" }
          Expand-Archive -Path ".emmylua/emmylua_check.zip" -DestinationPath ".emmylua" -Force
          Remove-Item ".emmylua/emmylua_check.zip" -Force

      - name: 运行 EmmyLua 诊断门禁
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          "$(Resolve-Path .emmylua)" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:PATH = "$((Resolve-Path .emmylua).Path);$env:PATH"
          lua tools/cli.lua emmylua
